<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gait Analysis – ระบบฟื้นฟูผู้ป่วย (ต้นแบบ UI ผู้ป่วย)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4FAF6; --surface:#FFFFFF; --surface2:#F7FCF8; --ink:#143024; --muted:#4E6A5B;
  --line:#CFE5D6; --line2:#E2F0E7;
  --pri:#178A55; --pri-d:#0F6F42; --pri-t:#E1F4E8; --on-pri:#FFFFFF;
  --blue:#2A66A8; --blue-t:#E6EFF8;
  --ok:#1B8A5A; --ok-t:#DDF2E6; --warn:#8F5A00; --warn-t:#FDF2D9;
  --neu:#4A6055; --neu-t:#E8F0EB; --danger:#B3261E; --danger-t:#FBE8E6;
  --hov:#9CC4AB; --figs:#A8CDB6; --brandg:linear-gradient(160deg,#1A9158,#0D6A40); --shadow:rgba(20,48,36,.16);
  --font:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B151C; --surface:#12212B; --surface2:#162833; --ink:#E7F0F5; --muted:#9FB2C0;
    --line:#26394A; --line2:#1E3140;
    --pri:#3CB8AE; --pri-d:#5FD0C6; --pri-t:#133B3A; --on-pri:#06201E;
    --blue:#7FB4EA; --blue-t:#16304A;
    --ok:#52C28C; --ok-t:#14372A; --warn:#F0BE64; --warn-t:#3B2E12;
    --neu:#A9BBC8; --neu-t:#1E3140; --danger:#F2A39E; --danger-t:#3F1D1A;
    --hov:#4A6A7E; --figs:#9DB6C2; --brandg:linear-gradient(160deg,#0A5E5A,#0A3F44); --shadow:rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0B151C; --surface:#12212B; --surface2:#162833; --ink:#E7F0F5; --muted:#9FB2C0;
  --line:#26394A; --line2:#1E3140;
  --pri:#3CB8AE; --pri-d:#5FD0C6; --pri-t:#133B3A; --on-pri:#06201E;
  --blue:#7FB4EA; --blue-t:#16304A;
  --ok:#52C28C; --ok-t:#14372A; --warn:#F0BE64; --warn-t:#3B2E12;
  --neu:#A9BBC8; --neu-t:#1E3140; --danger:#F2A39E; --danger-t:#3F1D1A;
  --hov:#4A6A7E; --figs:#9DB6C2; --brandg:linear-gradient(160deg,#0A5E5A,#0A3F44); --shadow:rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:inherit}
html{font-size:16px;height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html[data-size="l"]{font-size:17.5px}
html[data-size="xl"]{font-size:19px}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;padding:0 1.25rem;border-radius:var(--r);
  font-weight:600;border:1.5px solid transparent;transition:background .15s,transform .1s;text-align:center}
.btn:active{transform:scale(.985)}
.btn-pri{background:var(--pri);color:var(--on-pri)}
.btn-pri:hover{background:var(--pri-d)}
.btn-sec{background:var(--surface);border-color:var(--pri);color:var(--pri)}
.btn-sec:hover{background:var(--pri-t)}
.btn-soft{background:var(--pri-t);color:var(--pri-d)}
.btn-line{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-line:hover{background:var(--surface2)}
.btn-text{min-height:2.75rem;padding:0 .5rem;color:var(--pri);font-weight:600}
.btn-block{width:100%}
.btn-sm{min-height:2.5rem;padding:0 1rem;font-size:.95rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:1.15rem;height:1.15rem}

/* ---------- Form ---------- */
.lbl{display:block;font-weight:600;font-size:.95rem;margin:1.1rem 0 .4rem}
.lbl .req{color:var(--danger)}
.hint{font-size:.85rem;color:var(--muted);margin-top:.35rem}
.inp{width:100%;min-height:3rem;padding:0 .9rem;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);
  transition:border-color .15s,box-shadow .15s}
.inp:hover{border-color:var(--hov)}
.inp:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
.inp[readonly]{background:var(--surface2);color:var(--muted)}
.inp-wrap{position:relative}
.inp-wrap .inp{padding-right:3.2rem}
.eye{position:absolute;right:.3rem;top:50%;transform:translateY(-50%);width:2.6rem;height:2.6rem;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.eye svg{width:1.3rem;height:1.3rem}
.err{display:flex;gap:.5rem;align-items:flex-start;background:var(--danger-t);color:var(--danger);border-radius:var(--r);padding:.7rem .9rem;margin-top:1rem;font-size:.92rem;font-weight:500}
.notice{display:flex;gap:.7rem;align-items:flex-start;background:var(--blue-t);color:var(--ink);border-left:4px solid var(--blue);border-radius:6px;padding:.8rem 1rem;font-size:.92rem}
.notice.warn{background:var(--warn-t);border-left-color:var(--warn)}
.notice svg{flex:none;width:1.2rem;height:1.2rem;margin-top:.15rem;color:var(--blue)}
.notice.warn svg{color:var(--warn)}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-pad{padding:1.1rem 1.2rem}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 1.2rem;border-bottom:1px solid var(--line2)}
.card-h h2,.card-h h3{font-size:1.02rem;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.82rem;font-weight:600;padding:.18rem .65rem;border-radius:99px;white-space:nowrap}
.badge::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-t);color:var(--ok)}
.b-go{background:var(--warn-t);color:var(--warn)}
.b-no{background:var(--neu-t);color:var(--neu)}
.b-info{background:var(--blue-t);color:var(--blue)}
.b-info::before{display:none}
.muted{color:var(--muted)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem}
.page-h h1{font-size:1.5rem;font-weight:700;line-height:1.3}
.page-h p{color:var(--muted);font-size:.92rem}
.back{display:inline-flex;align-items:center;gap:.35rem;color:var(--pri);font-weight:600;min-height:2.75rem;margin-bottom:.25rem}
.back svg{width:1.1rem;height:1.1rem}

/* ---------- Shell ---------- */
.shell{min-height:100vh}
.side{display:none}
.appbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding:.7rem 1rem;padding-top:calc(.7rem + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;line-height:1.2}
.logo{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--pri-t);display:grid;place-items:center;flex:none;color:var(--pri)}
.logo svg{width:1.4rem;height:1.4rem}
.tag{font-size:.75rem;background:var(--warn-t);color:var(--warn);padding:.15rem .6rem;border-radius:99px;font-weight:600}
.page{max-width:1040px;margin:0 auto;padding:1.1rem 1rem calc(6.2rem + env(safe-area-inset-bottom,0px))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:.35rem .5rem calc(.35rem + env(safe-area-inset-bottom,0px))}
.bnav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:.25rem}
.bn{display:grid;justify-items:center;gap:.1rem;padding:.45rem 0 .35rem;border-radius:10px;color:var(--muted);font-size:.8rem;font-weight:500;min-height:3.6rem}
.bn svg{width:1.55rem;height:1.55rem}
.bn[aria-current="page"]{color:var(--pri);background:var(--pri-t);font-weight:600}

/* ---------- Patient banner ---------- */
.pbanner{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:center;padding:1rem 1.2rem}
.avatar{width:3.4rem;height:3.4rem;border-radius:50%;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;font-weight:700;font-size:1.25rem}
.pname{font-size:1.15rem;font-weight:700;line-height:1.3}
.pmeta{display:flex;flex-wrap:wrap;gap:.2rem 1.2rem;margin-top:.25rem;font-size:.9rem;color:var(--muted)}
.pmeta b{color:var(--ink);font-weight:600}

/* ---------- Dashboard ---------- */
.grid2{display:grid;gap:1rem;margin-top:1rem}
.ringcard{display:grid;grid-template-columns:auto 1fr;gap:1.4rem;align-items:center;padding:1.3rem 1.4rem}
.ring{position:relative;width:8.6rem;height:8.6rem}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--line2)}
.ring .br{stroke:var(--pri);transition:stroke-dashoffset .9s cubic-bezier(.3,.9,.3,1)}
.ring-t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-t b{font-size:2.1rem;font-weight:700;line-height:1}
.ring-t span{font-size:.78rem;color:var(--muted);margin-top:.2rem}
.kpis{display:grid;gap:.7rem}
.kpi{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding-bottom:.6rem;border-bottom:1px solid var(--line2)}
.kpi:last-child{border-bottom:0;padding-bottom:0}
.kpi span{color:var(--muted);font-size:.92rem}
.kpi b{font-size:1.1rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem;margin-top:.9rem}
.wd{display:grid;justify-items:center;gap:.3rem;font-size:.78rem;color:var(--muted)}
.wd i{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;background:var(--neu-t);color:var(--neu);font-style:normal}
.wd.ok i{background:var(--ok);color:#fff}
.wd.today i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--pri);background:var(--pri-t);color:var(--pri)}
.wd.today.ok i{background:var(--ok);color:#fff}
.wd.today{color:var(--ink);font-weight:600}
.next{padding:1.2rem 1.3rem;display:grid;gap:.8rem}
.next h3{font-size:1.15rem;font-weight:700;line-height:1.35}
.next .sub{color:var(--muted);font-size:.92rem}
.meas{width:100%;border-collapse:collapse}
.meas th,.meas td{text-align:left;padding:.7rem 1.2rem;border-bottom:1px solid var(--line2);font-size:.95rem}
.meas th{font-weight:500;color:var(--muted)}
.meas td{font-weight:700;font-size:1.05rem}
.meas td small{font-weight:400;color:var(--muted);font-size:.82rem;margin-left:.3rem}
.meas tr:last-child th,.meas tr:last-child td{border-bottom:0}
.empty{text-align:center;padding:2.2rem 1.2rem;display:grid;gap:.7rem;justify-items:center}
.empty svg{width:3rem;height:3rem;color:var(--muted)}
.empty h3{font-size:1.1rem}
.empty p{color:var(--muted);max-width:36ch}

/* ---------- Plan ---------- */
.mod{margin-top:1rem;overflow:hidden}
.mod-h{padding:.85rem 1.2rem;background:var(--surface2);border-bottom:1px solid var(--line);display:flex;gap:.7rem;align-items:baseline;flex-wrap:wrap}
.mod-h b{font-size:.82rem;color:var(--pri);background:var(--pri-t);padding:.1rem .6rem;border-radius:6px;font-weight:700}
.mod-h span{font-weight:600}
.prow{display:grid;gap:.7rem;padding:1rem 1.2rem;border-bottom:1px solid var(--line2)}
.prow:last-child{border-bottom:0}
.prow-main{display:flex;justify-content:space-between;gap:.8rem;align-items:flex-start}
.prow h3{font-size:1.02rem;font-weight:600;line-height:1.4}
.rx{font-size:.88rem;color:var(--muted);margin-top:.15rem}
.pbar{height:.5rem;background:var(--line2);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .5s}
.pbar.ok i{background:var(--ok)}
.pbar-l{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:.3rem}
.prow-act{display:flex;gap:.6rem;flex-wrap:wrap}

/* ---------- Select ---------- */
.sbox{position:relative}
.sbox svg{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);width:1.2rem;height:1.2rem;color:var(--muted)}
.sbox .inp{padding-left:2.6rem}
.acc{margin-top:.8rem;overflow:hidden}
.acc-h{width:100%;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 1.2rem;text-align:left;min-height:3.4rem}
.acc-h span{font-weight:600}
.acc-h b{color:var(--pri);margin-right:.4rem}
.acc-h svg{width:1.3rem;height:1.3rem;transition:transform .2s;flex:none}
.acc-h[aria-expanded="true"] svg{transform:rotate(180deg)}
.acc-b{border-top:1px solid var(--line2)}
.sel{padding:1rem 1.2rem;border-bottom:1px solid var(--line2);display:grid;gap:.7rem}
.sel:last-child{border-bottom:0}
.sel-top{display:flex;gap:.9rem;align-items:flex-start}
.chk{flex:none;width:1.7rem;height:1.7rem;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface);margin-top:.1rem}
.chk svg{width:1rem;height:1rem;opacity:0;color:var(--on-pri)}
.chk[aria-checked="true"]{background:var(--pri);border-color:var(--pri)}
.chk[aria-checked="true"] svg{opacity:1}
.sel-t{flex:1}
.sel-t h4{font-size:1rem;font-weight:600;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.4rem}
.tags span{font-size:.78rem;background:var(--blue-t);color:var(--blue);padding:.1rem .55rem;border-radius:6px;font-weight:500}
.sel-more{display:grid;gap:.8rem;padding-left:2.6rem}
.fig-box{background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r);aspect-ratio:200/110;max-width:360px}
.fig-box svg{width:100%;height:100%;display:block}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;max-width:360px}
.nums .lbl{margin-top:0}
.sticky-save{position:sticky;bottom:calc(5rem + env(safe-area-inset-bottom,0px));margin-top:1.2rem}

/* ---------- Detail ---------- */
.video{position:relative;background:var(--surface2);border:1px solid var(--line);border-radius:12px;aspect-ratio:16/9;overflow:hidden}
.video svg.fig{width:100%;height:100%;display:block}
.play{position:absolute;right:.8rem;bottom:.8rem;display:flex;align-items:center;gap:.4rem;background:var(--surface);border:1px solid var(--line);border-radius:99px;min-height:2.6rem;padding:0 1rem;font-weight:600;font-size:.9rem}
.play svg{width:1rem;height:1rem}
.steps{display:grid;gap:.7rem;counter-reset:s}
.step{display:grid;grid-template-columns:2rem 1fr;gap:.8rem;padding:.9rem 1.1rem;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.step::before{counter-increment:s;content:counter(s);width:2rem;height:2rem;border-radius:50%;background:var(--pri-t);color:var(--pri-d);display:grid;place-items:center;font-weight:700;font-size:.95rem}
.step h4{font-weight:600}
.step p{color:var(--muted);font-size:.95rem;margin-top:.1rem}
.dl{display:grid;grid-template-columns:auto 1fr;gap:.55rem 1.2rem}
.dl dt{color:var(--muted);font-size:.92rem}
.dl dd{font-weight:600;text-align:right}
.sec-t{font-size:1.05rem;font-weight:700;margin:1.4rem 0 .7rem}

/* ---------- Progress ---------- */
.chips{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:.8rem}
.chip{flex:none;min-height:2.6rem;padding:0 1rem;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--on-pri);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--neu-t);border-radius:var(--r);padding:.25rem;gap:.25rem}
.seg button{min-height:2.6rem;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px var(--shadow)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .g{stroke:var(--line2);stroke-width:1}
.chart .ax{stroke:var(--line);stroke-width:1.2}
.chart .ln{stroke:var(--blue);stroke-width:2.5;fill:none;stroke-linejoin:round}
.chart .pt{fill:var(--surface);stroke:var(--blue);stroke-width:2.5}
.chart .pt.hi{fill:var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.8rem}
.stat{padding:1rem 1.1rem}
.stat span{font-size:.88rem;color:var(--muted)}
.stat b{display:block;font-size:1.7rem;font-weight:700;line-height:1.3}
.stat b.up{color:var(--ok)}
.stat b.dn{color:var(--danger)}
.sess{margin-top:.8rem;padding:1rem 1.2rem}
.sess-h{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.8rem}
.sess-h b{font-size:1.05rem}
.setrow{display:grid;grid-template-columns:5rem 1fr 3.6rem;gap:.8rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--line2);font-size:.92rem}
.setrow span:last-child{text-align:right;font-weight:600}

/* ---------- Profile ---------- */
.row{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.95rem 1.2rem;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row .seg{min-width:15rem}

/* ---------- Auth ---------- */
.auth{min-height:100vh;display:grid}
.auth-brand{display:none}
.auth-form{display:grid;place-items:start center;padding:1.4rem 1rem 2rem}
.auth-card{width:100%;max-width:440px}
.auth-card .logo{width:4rem;height:4rem;margin:.5rem auto 1rem}
.auth-card .logo svg{width:2.4rem;height:2.4rem}
.auth-card h1{font-size:1.6rem;font-weight:700;line-height:1.3}
.auth-card .sub{color:var(--muted);margin-top:.2rem}
.auth-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.4rem 1.3rem 1.5rem;margin-top:1.2rem}
.divider{display:flex;align-items:center;gap:.8rem;color:var(--muted);font-size:.88rem;margin:1.1rem 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.foot-note{text-align:center;color:var(--muted);font-size:.85rem;margin-top:1.4rem}
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:1rem 0 .5rem}
.stepper i{height:.35rem;border-radius:99px;background:var(--line)}
.stepper i.on{background:var(--pri)}
.stp{display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.92rem}
.stp b{color:var(--pri)}
.idbox{min-height:3.2rem;border:1.5px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;letter-spacing:.7em;font-size:1.4rem;font-weight:600;color:var(--muted);background:var(--surface2)}
.btns{display:grid;gap:.7rem;margin-top:1.4rem}

/* ---------- Figure ---------- */
.fig .l{stroke:var(--pri);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .s{stroke:var(--figs);stroke-width:6;stroke-linecap:round;fill:none}
.fig .h{fill:var(--pri)}
.fig .torso{transform-origin:80px 95px}
.fig .shank{transform-origin:130px 95px}
.fig .foot{transform-origin:130px 138px}
.fig.play.v-trunk .torso{animation:lean 3.4s ease-in-out infinite}
.fig.play.v-foot .foot{animation:flex 2.6s ease-in-out infinite}
.fig.play.v-knee .shank{animation:ext 3.6s ease-in-out infinite}
.fig.play.v-stand .torso{animation:fwd 3.4s ease-in-out infinite}

.panel{display:grid;gap:.8rem;align-content:start}
.reads{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}

function calcAge(dob){
  if(!dob)return'';const b=new Date(dob);if(isNaN(b))return'';
  let a=TODAY.getFullYear()-b.getFullYear();
  if(TODAY.getMonth()<b.getMonth()||(TODAY.getMonth()===b.getMonth()&&TODAY.getDate()<b.getDate()))a--;
  return a>=0&&a<130?a:'';
}

/* ----- Progress ----- */
function seriesFor(id,range){
  const c=S.cfg[id],max=c.sets*c.reps;
  const cfg={7:{n:7,step:1},30:{n:10,step:3},90:{n:12,step:7},365:{n:12,step:30}}[range];
  const pts=[];
  for(let i=0;i<cfg.n;i++){
    const off=-(cfg.n-1-i)*cfg.step,d=addDays(TODAY,off);
    const r=0.3+0.55*i/(cfg.n-1)+0.07*Math.sin(i*2.3+id.length);
    let v=Math.max(1,Math.min(max,Math.round(r*max)));
    if(i===cfg.n-1)v=(S.rec[id]||[]).reduce((a,b)=>a+b,0);
    pts.push({d,v});
  }
  return {pts,max};
}
function chartSVG(pts,max){
  const W=640,H=270,L=44,R=16,T=16,B=36,pw=W-L-R,ph=H-T-B;
  const top=Math.max(5,Math.ceil(max/5)*5),x=i=>L+pw*i/(pts.length-1),y=v=>T+ph*(1-v/top);
  const ticks=[0,.25,.5,.75,1].map(f=>Math.round(top*f));
  const best=pts.reduce((b,p,i)=>p.v>pts[b].v?i:b,0);
  const every=Math.ceil(pts.length/6);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟจำนวนครั้งที่ทำได้ตามวัน">
  ${ticks.map(t=>`<line class="g" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join('')}
  <line class="ax" x1="${L}" x2="${L}" y1="${T}" y2="${T+ph}"/><line class="ax" x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}"/>
  <text x="4" y="12" style="font-size:10px">จำนวนครั้ง</text>
  <polyline class="ln" points="${pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(' ')}"/>
  ${pts.map((p,i)=>`<circle class="pt ${i===best?'hi':''}" cx="${x(i)}" cy="${y(p.v)}" r="${i===best?5.5:4}"/>`).join('')}
  ${pts.map((p,i)=>(i%every===0||i===pts.length-1)?`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${fDate(p.d)}</text>`:'').join('')}
  </svg>`;
}
function sessionsFor(id){
  const c=S.cfg[id],out=[],rec=S.rec[id]||[];
  if(rec.length)out.push({d:TODAY,sets:rec,full:rec.length>=c.sets});
  const past=[[-1,[5,5,5]],[-2,[5,4,4]]];
  past.forEach(([o,arr])=>out.push({d:addDays(TODAY,o),sets:arr.map(v=>Math.min(v,c.reps)),full:true}));
  return out;
}

}

function setL(id,a,b){const n=document.getElementById(id);if(!n)return;n.setAttribute('x1',a[0]);n.setAttribute('y1',a[1]);n.setAttribute('x2',b[0]);n.setAttribute('y2',b[1])}
function setC(id,p){const n=document.getElementById(id);if(!n)return;n.setAttribute('cx',p[0]);n.setAttribute('cy',p[1])}
function setT(id,x,y){const n=document.getElementById(id);if(n)n.setAttribute('transform',`translate(${x},${y})`)}
function txt(id,v){const n=document.getElementById(id);if(n)n.textContent=v}
function updateSkeleton(){
  const T=4.2,ph=(C.t%T)/T,e=.5-.5*Math.cos(2*Math.PI*ph),knee=98+54*e;
  const back=10+5*Math.sin(C.t*.9);
  const H=SK.H,Sh=[H[0]+SK.TR*Math.sin(rad(back)),H[1]-SK.TR*Math.cos(rad(back))];
  const K=[H[0]+SK.TH,H[1]],th=rad(knee);
  const A=[K[0]-SK.SH*Math.cos(th),K[1]+SK.SH*Math.sin(th)];
  const To=[A[0]+26*Math.sin(th),A[1]+26*Math.cos(th)];
  const Hd=[Sh[0]+4,Sh[1]-34],El=[Sh[0]+26,Sh[1]+52],Wr=[H[0]+70,H[1]-12];
  setL('b-torso',H,Sh);setL('b-thigh',H,K);setL('b-shank',K,A);
  setL('k-torso',H,Sh);setL('k-thigh',H,K);setL('k-shank',K,A);setL('k-foot',A,To);setL('k-arm1',Sh,El);setL('k-arm2',El,Wr);setL('k-neck',Sh,[Hd[0],Hd[1]+18]);
  const hd=document.getElementById('head');if(hd){hd.setAttribute('cx',Hd[0]);hd.setAttribute('cy',Hd[1])}
  setC('p-sh',Sh);setC('p-hip',H);setC('p-kn',K);setC('p-an',A);setC('p-to',To);setC('p-el',El);setC('p-wr',Wr);setC('p-hd',[Hd[0],Hd[1]+2]);
  const v1=[Sh[0]-H[0],Sh[1]-H[1]],v2=[K[0]-H[0],K[1]-H[1]];
  const hip=deg(Math.acos((v1[0]*v2[0]+v1[1]*v2[1])/(Math.hypot(...v1)*Math.hypot(...v2))));
  const bk=Math.round(back),hp=Math.round(hip),kn=Math.round(knee);
  setT('lb',Sh[0]+58,Sh[1]-24);setT('lh',H[0]-62,H[1]-8);setT('lk',K[0]+4,K[1]-62);
  txt('lbv',bk+'°');txt('lhv',hp+'°');txt('lkv',kn+'°');txt('rb',bk+'°');txt('rh',hp+'°');txt('rk',kn+'°');
  if(C.state==='flex'&&knee>=146)C.state='ext';
  else if(C.state==='ext'&&knee<=106){C.state='flex';if(C.reps<C.target)C.reps++}
  txt('rn',C.reps);
  const bar=document.getElementById('rbar');if(bar)bar.style.width=(C.reps/C.target*100)+'%';
  const sb=document.getElementById('savebtn');
  if(sb){sb.disabled=C.reps===0;sb.classList.toggle('pulse',C.reps>=C.target)}
  txt('rmsg',C.reps>=C.target?'ครบจำนวนครั้งตามกำหนดแล้ว กดบันทึกเซตได้':C.reps>0?'เหลืออีก '+(C.target-C.reps)+' ครั้ง':'ทำท่าตามขั้นตอน ระบบจะนับให้อัตโนมัติ');
}

/* ============ Events ============ */
function setPath(k,v){
  if(k.startsWith('login.'))S.login[k.slice(6)]=v;
  else if(k.startsWith('reg.'))S.reg[k.slice(4)]=v;
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.k){let v=t.value;if(t.inputMode==='numeric')v=v.replace(/\D/g,''),t.value=v;setPath(t.dataset.k,v);
    if(t.dataset.k==='reg.dob'){const a=calcAge(v),n=$('#r-age');if(n)n.value=a}}
  else if(t.id==='q'){S.q=t.value;const pos=t.selectionStart;render();const n=$('#q');if(n){n.focus();n.setSelectionRange(pos,pos)}}
  else if(t.dataset.cfg){const [id,k]=t.dataset.cfg.split('.');const n=Math.max(1,Math.min(k==='sets'?6:20,parseInt(t.value)||1));S.draftCfg[id]=S.draftCfg[id]||{sets:3,reps:5};S.draftCfg[id][k]=n}
});
document.addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'&&t.dataset.k)setPath(t.dataset.k,t.value)});

function fail(m){S.err=m;render()}
function onAct(a,g){
  switch(a){
  case 'eye':if(g==='login')S.login.show=!S.login.show;else S.reg.show=!S.reg.show;render();break;
  case 'forgot':fail('ต้นแบบนี้ยังไม่มีขั้นตอนกู้รหัสผ่าน โปรดติดต่อเจ้าหน้าที่');break;
  case 'login':{const L=S.login;
    if(L.id.length!==13)return fail('กรุณากรอกเลขบัตรประจำตัวประชาชนให้ครบ 13 หลัก');
    if(!L.pw)return fail('กรุณากรอกรหัสผ่าน');
    demoLogin();go('home');break;}
  case 'toreg':S.reg={step:1,id:'',pw:'',pw2:'',user:'',name:'',dob:'',sex:'',comorb:'',type:'',onset:'',show:false};go('reg');break;
  case 'tologin':go('login');break;
  case 'logout':closeCam();S.user=null;S.err='';go('login');break;
  case 'reg-back':S.reg.step=S.reg.step===4&&!S.reg.pw?2:S.reg.step-1;S.err='';render();break;
  case 'reg-go':S.reg.step=+g;S.err='';render();break;
  case 'reg-next':{const R=S.reg;
    if(R.step===1){if(R.id.length!==13)return fail('กรุณากรอกเลขบัตรประจำตัวประชาชนให้ครบ 13 หลัก');R.step=2}
    else if(R.step===3){if(R.pw.length<6)return fail('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');if(R.pw!==R.pw2)return fail('รหัสผ่านทั้งสองช่องไม่ตรงกัน');R.step=4}
    else if(R.step===4){if(!R.name.trim())return fail('กรุณากรอกชื่อ - นามสกุล');if(!R.dob)return fail('กรุณาเลือกวันเดือนปีเกิด');if(!R.sex)return fail('กรุณาเลือกเพศ');R.step=5}
    else{if(!R.type)return fail('กรุณาเลือกประเภทโรคหลอดเลือดสมอง');if(!R.onset)return fail('กรุณาเลือกวันที่เป็นโรคหลอดเลือดสมอง');
      const o=new Date(R.onset);
      S.user={name:R.name.trim(),age:calcAge(R.dob),sex:R.sex,dx:R.type,onset:fFull(o),idm:R.id.charAt(0)+'-'+R.id.slice(1,5)+'-xxxxx-xx-'+R.id.slice(-1),comorb:R.comorb||'ไม่มี'};
      S.plan=[];S.cfg={};S.done={};S.rec={};go('home');return}
    S.err='';render();break;}
  case 'nav':closeCam();go(g);break;
  case 'toselect':S.draft=[...S.plan];S.draftCfg=JSON.parse(JSON.stringify(S.cfg));S.exp={};S.q='';S.open={1:true};go('select');break;
  case 'selback':go(S.plan.length?'train':'home');break;
  case 'acc':S.open[g]=!S.open[g];render();break;
  case 'chk':{const i=S.draft.indexOf(g);if(i>=0)S.draft.splice(i,1);else{S.draft.push(g);S.draftCfg[g]=S.draftCfg[g]||{sets:3,reps:5}}render();break;}
  case 'exp':S.exp[g]=!S.exp[g];render();break;
  case 'selsave':{
    const nc={},nd={},nr={};
    S.draft.forEach(id=>{nc[id]=S.draftCfg[id]||{sets:3,reps:5};nd[id]=Math.min(S.done[id]||0,nc[id].sets);nr[id]=(S.rec[id]||[]).slice(0,nd[id])});
    S.plan=MODS.flatMap(m=>m.ex).filter(id=>S.draft.includes(id));S.cfg=nc;S.done=nd;S.rec=nr;go('train');break;}
  case 'detail':S.detailId=g;S.playing=true;go('detail');break;
  case 'playtoggle':S.playing=!S.playing;render();break;
  case 'start':openCam(g);break;
  case 'viewprog':S.pexId=g;S.ptab='detail';go('prog');break;
  case 'pex':S.pexId=g;render();break;
  case 'ptab':S.ptab=g;render();break;
  case 'range':S.prange=g;render();break;
  case 'size':S.size=g;if(g)document.documentElement.dataset.size=g;else document.documentElement.removeAttribute('data-size');render();break;
  case 'theme':S.theme=g;if(g)document.documentElement.dataset.theme=g;else document.documentElement.removeAttribute('data-theme');render();break;
  /* camera */
  case 'camgo':C.phase='run';C.last=0;drawCam();C.raf=requestAnimationFrame(camLoop);break;
  case 'camstop':if(C.phase==='prep'){closeCam();break}C.confirm=true;drawCam();break;
  case 'camcont':C.confirm=false;drawCam();break;
  case 'camexit':closeCam();render();break;
  case 'campause':C.run=!C.run;txt('pausebtn',C.run?'หยุดชั่วคราว':'ทำต่อ');txt('rect',C.run?'กำลังวิเคราะห์ท่าทาง (จำลอง)':'หยุดชั่วคราว');document.getElementById('recl').classList.toggle('off',!C.run);break;
  case 'camreset':C.reps=0;C.state='flex';C.t=0;break;
  case 'camsave':{const id=C.id;S.done[id]=Math.min(C.setNo,S.cfg[id].sets);S.rec[id]=(S.rec[id]||[]);S.rec[id][C.setNo-1]=C.reps;C.saved=C.reps;drawCam();break;}
  case 'camnext':{const id=C.id;cancelAnimationFrame(C.raf);openCam(id);break;}
  case 'camprog':{const id=C.id;closeCam();S.pexId=id;S.ptab='detail';go('prog');break;}
  case 'camhome':closeCam();go('home');break;
  }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  onAct(b.dataset.act,b.dataset.arg);
});
render();
</script>
